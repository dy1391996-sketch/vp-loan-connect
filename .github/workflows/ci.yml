name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vp
          POSTGRES_PASSWORD: vp_test_password
          POSTGRES_DB: vp_loan_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vp -d vp_loan_connect_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vp:vp_test_password@localhost:5432/vp_loan_connect_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-characters-long
      REPORT_SIGNING_SECRET: ci-report-signing-secret-at-least-32-characters
      SUPPORT_EMAIL: support@vploanconnect.in
      OTP_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      WHATSAPP_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec prisma validate
      - run: pnpm verify:migration
      - run: pnpm verify:readiness
      - run: pnpm db:deploy
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
